name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.GPG_KEY_ID }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release
        run: ./gradlew :leagueapi:verifyReleaseConfiguration :datadragon:verifyReleaseConfiguration -PreleaseVersion="${GITHUB_REF_NAME#v}" --no-daemon

      - name: Build release assets
        run: ./gradlew :leagueapi:build :datadragon:build -PreleaseVersion="${GITHUB_REF_NAME#v}" --no-daemon

      - name: Publish to Central Portal
        run: ./gradlew publishAggregationToCentralPortal -PreleaseVersion="${GITHUB_REF_NAME#v}" --no-daemon

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "fiddlesticks $RELEASE_TAG" \
            "leagueapi/build/libs/leagueapi-${RELEASE_VERSION}.jar" \
            "leagueapi/build/libs/leagueapi-${RELEASE_VERSION}-sources.jar" \
            "leagueapi/build/libs/leagueapi-${RELEASE_VERSION}-javadoc.jar" \
            "datadragon/build/libs/datadragon-${RELEASE_VERSION}.jar" \
            "datadragon/build/libs/datadragon-${RELEASE_VERSION}-sources.jar" \
            "datadragon/build/libs/datadragon-${RELEASE_VERSION}-javadoc.jar"
